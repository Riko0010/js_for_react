<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Etudiant</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e0f7fa, #f3e5f5);
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        padding: 32px 40px;
        width: 360px;
        text-align: center;
      }

      .label {
        display: block;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #666;
        margin-bottom: 12px;
      }

      #result {
        font-size: 22px;
        font-weight: bold;
        color: #1f2937;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="label">Fiche Étudiant</span>
      <div id="result"></div>
    </div>

    <script src="index.js" type="module"></script>
  </body>
</html>
